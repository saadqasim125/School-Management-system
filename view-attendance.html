<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Attendance</title>

<link rel="stylesheet" href="attendance.css">
</head>

<body>

<div class="header">
<h1>Attendance List</h1>

<div>
<button class="btn" onclick="window.location.href='add-attendance.html'">
Add Attendance
</button>

<button class="btn add-btn" onclick="window.location.href='view-student.html'">
View Students
</button>
</div>
</div>

<div class="card">

<div class="grid">

<div class="group">
<input id="search" placeholder="Search student..." oninput="renderAttendance()">
</div>

<div class="group">
<select id="filterClass" onchange="renderAttendance()">
<option value="">All Classes</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option><option>10</option>
</select>
</div>

</div>

<table>
<thead>
<tr>
<th>Class</th>
<th>Month</th>
<th>Roll</th>
<th>Name</th>
<th>Present</th>
<th>Absent</th>
<th>Leave</th>
</tr>
</thead>

<tbody id="attBody"></tbody>
</table>

</div>

<script src="attendance.js"></script>
<script src="voice-ai.js"></script>
</body>
</html>
