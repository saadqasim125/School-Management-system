<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Attendance</title>
<link rel="stylesheet" href="attendance.css">
</head>

<body>

<div class="header">
<h1>Attendance List</h1>

<div>
<button class="btn" onclick="window.location.href='add-attendance.html'">
Add Attendance
</button>

<button class="btn add-btn" onclick="window.location.href='view-student.html'">
View Students
</button>
</div>
</div>

<div class="card">

<div class="grid">

<div class="group">
<input id="search" placeholder="Search student..." oninput="renderAttendance()">
</div>

<div class="group">
<select id="filterClass" onchange="renderAttendance()">
<option value="">All Classes</option>
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>
<option value="6">Class 6</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
</select>
</div>

<div class="group">
<input type="date" id="filterDate" onchange="renderAttendance()">
</div>

</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Class</th>
<th>Roll</th>
<th>Name</th>
<th>Status</th>
</tr>
</thead>

<tbody id="attBody"></tbody>
</table>

</div>

<script>

// ==========================
// AUTO TODAY DATE
// ==========================
window.onload = () => {
  document.getElementById("filterDate").value =
    new Date().toISOString().split("T")[0];

  renderAttendance();
};

// ==========================
// RENDER ATTENDANCE
// ==========================
function renderAttendance() {

  let data = JSON.parse(localStorage.getItem("attendanceData")) || [];

  const search = document.getElementById("search").value.toLowerCase();
  const filterClass = document.getElementById("filterClass").value;
  const filterDate = document.getElementById("filterDate").value;

  const body = document.getElementById("attBody");
  body.innerHTML = "";

  data.forEach(record => {

    // DATE FILTER
    if (filterDate && record.date !== filterDate) return;

    record.attendance.forEach(stu => {

      // SEARCH FILTER
      if (!stu.name.toLowerCase().includes(search)) return;

      // CLASS FILTER (IMPORTANT FIX)
      if (filterClass && record.class && record.class !== filterClass) return;

      let status = stu.status;

      let color = "";
      if (status === "present") color = "green";
      else if (status === "absent") color = "red";
      else if (status === "leave") color = "orange";

      body.innerHTML += `
        <tr>
          <td>${record.date}</td>
          <td>${record.class || "-"}</td>
          <td>${stu.roll}</td>
          <td>${stu.name}</td>
          <td style="color:${color}; font-weight:bold;">
            ${status.toUpperCase()}
          </td>
        </tr>
      `;
    });
  });
}

</script>


</body>
</html>
