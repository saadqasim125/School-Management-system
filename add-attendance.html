<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Attendance</title>
<link rel="stylesheet" href="attendance.css">
</head>

<body>

<div class="header">
  <h1>Daily Attendance</h1>

  <div>
    <button class="btn" onclick="window.location.href='view-attendance.html'">
      View Attendance
    </button>

    <button class="btn add-btn" onclick="window.location.href='view-student.html'">
      View Students
    </button>
  </div>
</div>

<div class="card">

  <div class="grid">

    <!-- CLASS SELECT (NEW FIX) -->
    <div class="group">
      <label>Class</label>
      <select id="classSelect" onchange="loadStudents()">
        <option value="">Select Class</option>
        <option value="1">Class 1</option>
        <option value="2">Class 2</option>
        <option value="3">Class 3</option>
        <option value="4">Class 4</option>
        <option value="5">Class 5</option>
        <option value="6">Class 6</option>
        <option value="7">Class 7</option>
        <option value="8">Class 8</option>
        <option value="9">Class 9</option>
        <option value="10">Class 10</option>
      </select>
    </div>

    <!-- DATE AUTO -->
    <div class="group">
      <label>Date</label>
      <input type="date" id="date">
    </div>

    <!-- SEARCH -->
    <div class="group full">
      <input id="search" placeholder="Search student..." oninput="loadStudents()">
    </div>

  </div>

  <table>
    <thead>
      <tr>
        <th>Roll</th>
        <th>Name</th>
        <th>Present</th>
        <th>Absent</th>
        <th>Leave</th>
      </tr>
    </thead>

    <tbody id="body"></tbody>
  </table>

  <button class="save" onclick="saveAttendance()">Save Attendance</button>

</div>

<script>

// ==========================
// AUTO DATE
// ==========================
window.onload = () => {
  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];
};

// ==========================
// LOAD STUDENTS BY CLASS
// ==========================
function loadStudents() {

  const cls = document.getElementById("classSelect").value;
  const search = document.getElementById("search").value.toLowerCase();

  let students = JSON.parse(localStorage.getItem("students")) || [];

  // ❗ FILTER BY CLASS FIRST
  let filtered = students.filter(s => {
    return (!cls || s.class == cls) &&
           s.name.toLowerCase().includes(search);
  });

  const body = document.getElementById("body");
  body.innerHTML = "";

  filtered.forEach((stu, index) => {

    let groupName = "att_" + index;

    let row = document.createElement("tr");

    row.innerHTML = `
      <td>${stu.roll}</td>
      <td>${stu.name}</td>

      <td><input type="radio" name="${groupName}" value="present"></td>
      <td><input type="radio" name="${groupName}" value="absent"></td>
      <td><input type="radio" name="${groupName}" value="leave"></td>
    `;

    body.appendChild(row);
  });
}

// ==========================
// SAVE ATTENDANCE
// ==========================
function saveAttendance() {

  const cls = document.getElementById("classSelect").value;
  const date = document.getElementById("date").value;

  if (!cls) {
    alert("Please select class");
    return;
  }

  let rows = document.querySelectorAll("#body tr");

  let attendance = [];

  rows.forEach((row, i) => {

    let radios = document.getElementsByName("att_" + i);
    let status = "";

    radios.forEach(r => {
      if (r.checked) status = r.value;
    });

    attendance.push({
      roll: row.children[0].innerText,
      name: row.children[1].innerText,
      status: status || "not-marked"
    });

  });

  let data = JSON.parse(localStorage.getItem("attendanceData")) || [];

  data.push({
    class: cls,
    date: date,
    attendance: attendance
  });

  localStorage.setItem("attendanceData", JSON.stringify(data));

  alert("Attendance saved successfully!");
}

</script>
<script src="voice-ai.js"></script>
</body>
</html>
