<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Teacher Attendance</title>

<style>
:root{
  --primary:#1E40AF;
  --bg:#F8FAFC;
  --text:#1F2937;
  --border:#E5E7EB;
}

body{
  background:var(--bg);
  padding:20px;
  font-family:Segoe UI;
}

.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.btn{
  background:#1F2937;
  color:white;
  padding:10px 14px;
  border:none;
  border-radius:10px;
}

.primary{
  background:var(--primary);
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
}

input{
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--primary);
  color:white;
  padding:12px;
}

td{
  padding:10px;
  border-bottom:1px solid var(--border);
}
</style>
</head>

<body>

<div class="header">
<h1>Teacher Attendance</h1>

<button class="btn primary"
onclick="window.location.href='add-teacher-attendance.html'">
Add
</button>
</div>

<div class="card">

<input type="date" id="date" onchange="render()">

<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

</div>

<script src="teachers.js"></script>

<script>

window.onload = () => {
  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

  render();
};

function render(){

  let date = document.getElementById("date").value;

  let teachers = getTeachers();
  let data = JSON.parse(localStorage.getItem("teacherAttendance")) || [];

  let body = document.getElementById("body");
  body.innerHTML = "";

  teachers.forEach(t => {

    // 🔥 FIX: use FILTER + last record (NOT find)
    let recs = data.filter(r =>
      r.teacherId == t.id && r.date == date
    );

    let latest = recs.length ? recs[recs.length - 1] : null;

    let status = latest ? latest.status : "not marked";

    let color =
      status=="present"?"green":
      status=="absent"?"red":
      status=="leave"?"orange":"gray";

    body.innerHTML += `
      <tr>
        <td>${t.name}</td>
        <td style="color:${color};font-weight:bold;">
          ${status.toUpperCase()}
        </td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
